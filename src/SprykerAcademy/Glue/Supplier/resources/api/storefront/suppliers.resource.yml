resource:
    name: Suppliers
    shortName: Supplier
    description: Supplier management API for storefront operations
    provider: SprykerAcademy\Glue\Supplier\Api\Storefront\Provider\SuppliersStorefrontProvider
    operations:
        - type: Get
        - type: GetCollection
    properties:
        idSupplier:
            type: integer
            description: The unique supplier identifier
            identifier: true
        name:
            type: string
            description: Supplier name
        description:
            type: string
            description: Supplier description
        status:
            type: integer
            description: Active when 1, inactive when 0
        email:
            type: string
            description: Supplier email
        phone:
            type: string
            description: Supplier phone
